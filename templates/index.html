<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trader Bot Dashboard</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .btn { padding: 10px 20px; margin: 5px; background: #007BFF; color: white; border: none; cursor: pointer; }
        .btn.stop { background: #DC3545; }
    </style>
</head>
<body>
    <h1>Trader Bot Dashboard</h1>
    <p>Status: {{ 'Running' if status.running else 'Stopped' }}</p>
    <p>Last Price: {{ status.last_price }}</p>
    <p>EMA8: {{ status.ema8 }}</p>
    <p>EMA20: {{ status.ema20 }}</p>
    <p>Signal: {{ status.signal }}</p>
    <p>Positions: {{ status.positions|length }}</p>

    <a href="{{ url_for('start_bot') }}" class="btn">Start Bot</a>
    <a href="{{ url_for('stop_bot') }}" class="btn stop">Stop Bot</a>
</body>
</html>
